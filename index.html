<!DOCTYPE html>
<html lang="cs">
<head>

<meta charset="utf-8">

<title>Fronta 3D tisku</title>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 0 5px rgba(0,0,0,.15);
}

.time{
    color:gray;
    font-size:12px;
}

</style>

</head>

<body>

<h1>🖨 Fronta 3D tisku</h1>

<div id="content"></div>

<script>

fetch("data.json")
.then(r => r.json())
.then(data => {

    let html = "";

    data.reverse();

    data.forEach(item => {

        html += `
        <div class="card">

            <div class="time">
                ${item.created}
            </div>

            <h3>
                ${item.name || "Anonym"}
            </h3>

            <p>
                <b>Barva:</b>
                ${item.color}
            </p>

            <p>
                <b>Doručení:</b>
                ${item.delivery}
            </p>

            <p>
                <b>Model:</b>
                <a href="${item.model}" target="_blank">
                    otevřít
                </a>
            </p>

            <p>
                ${item.notes}
            </p>

        </div>
        `;
    });

    document.getElementById("content").innerHTML = html;

});

</script>

</body>
</html>
