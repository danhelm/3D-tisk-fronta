<script>

fetch("data.json")
.then(r => r.json())
.then(data => {

    let html = "";

    data.reverse();

    data.forEach(item => {

        html += `
        <div class="card">
            <h3>${item.name}</h3>
            <p><b>Barva:</b> ${item.color}</p>
            <p><a href="${item.model}" target="_blank">Model</a></p>
            <p>${item.notes}</p>
        </div>
        `;
    });

    document.getElementById("queue").innerHTML = html;

});

</script>
